workflows:
  yueji-unsigned-ipa:
    name: YueJi IPA (unsigned)
    instance_type: mac_mini_m2
    # Includes cold simulator startup, both required test suites and device packaging.
    # Stage/case deadlines below stop stalled work before this overall safety limit.
    max_build_duration: 90
    environment:
      xcode: "27.1"
    scripts:
      - name: Verify project and record source version
        script: |
          set -euo pipefail
          python3 scripts/check_project.py
          xcodebuild -version
          python3 - <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path
          info = plistlib.loads(Path('YueJi/Info.plist').read_bytes())
          sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], text=True).strip()
          if int(sdk.split('.')[0]) < 27:
              raise SystemExit(f'The native iOS 27 build requires an iOS 27 SDK; found {sdk}')
          toolchain = subprocess.check_output(['xcodebuild', '-version'], text=True).strip()
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          label = f"{info['CFBundleShortVersionString']}-build{info['CFBundleVersion']}-{commit[:7]}"
          with open(os.environ['CM_ENV'], 'a') as env:
              env.write(f'IPA_LABEL={label}\n')
          Path('BuildInfo.txt').write_text(f'YueJi {label}\nSource commit: {commit}\n{toolchain}\niPhone SDK: {sdk}\nUnsigned IPA for personal signing.\n')
          PY
      - name: Choose an iOS 27 iPhone simulator
        script: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/yueji-simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path('/tmp/yueji-simulators.json').read_text())['devices']
          phones = [(runtime, phone) for runtime, phones in devices.items() if 'iOS-27-' in runtime
                    for phone in phones if phone.get('isAvailable') and 'iPhone' in phone['name']]
          if not phones:
              raise SystemExit('No available iOS 27 iPhone simulator on this build machine')
          phones.sort(key=lambda item: (not item[0].endswith('iOS-27-0'), item[1]['name'] != 'iPhone 17', item[1]['name']))
          runtime, phone = phones[0]
          print(f"Testing {phone['name']} on {runtime}")
          with open(os.environ['CM_ENV'], 'a') as env:
              env.write(f"SIMULATOR_ID={phone['udid']}\n")
          with open('BuildInfo.txt', 'a') as info:
              info.write(f"Test simulator: {phone['name']} ({runtime})\n")
          PY
      - name: Build and test on iPhone simulator
        script: |
          set -euo pipefail
          trap 'python3 scripts/report_test_failures.py build-test.log --output test-failures.txt' EXIT
          python3 -u scripts/run_simulator_tests.py --simulator "$SIMULATOR_ID" --artifacts .
      - name: Build unsigned iPhone app
        script: |
          set -euo pipefail
          python3 -u - <<'PY'
          from scripts.run_simulator_tests import run_stage
          command = ['xcodebuild', 'build', '-project', 'YueJi.xcodeproj', '-scheme', 'YueJi',
                     '-configuration', 'Release', '-sdk', 'iphoneos', '-destination', 'generic/platform=iOS',
                     '-derivedDataPath', 'build-device', '-showBuildTimingSummary',
                     'CODE_SIGNING_ALLOWED=NO', 'CODE_SIGNING_REQUIRED=NO']
          with open('build-device.log', 'w', encoding='utf-8') as log:
              raise SystemExit(run_stage(command, log, timeout=600))
          PY
      - name: Verify and package IPA for personal signing
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('build-device/Build/Products/Release-iphoneos/YueJi.app')
          source = plistlib.loads(Path('YueJi/Info.plist').read_bytes())
          built = plistlib.loads((app / 'Info.plist').read_bytes())
          for key in ['CFBundleShortVersionString', 'CFBundleVersion']:
              assert built[key] == source[key], f'Built app does not match source: {key}'
          for resource in ['YueJi', 'Assets.car', 'YueJiIncoming.wav', 'YueJiOutgoing.wav', 'YueJiIcon@2x.png', 'YueJiIcon@3x.png']:
              assert (app / resource).is_file(), f'Missing app resource: {resource}'
          PY
          mkdir -p package/Payload
          cp -R build-device/Build/Products/Release-iphoneos/YueJi.app package/Payload/
          cd package
          zip -qr "../YueJi-${IPA_LABEL}-unsigned.ipa" Payload
    artifacts:
      - YueJi-*-unsigned.ipa
      - BuildInfo.txt
      - build-test.log
      - build-device.log
      - test-failures.txt
      - UnitTestResults.xcresult
      - UITestResults.xcresult
