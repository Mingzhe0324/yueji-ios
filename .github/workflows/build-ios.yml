name: Build YueJi iPhone App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    # Simulator tests can take 32 minutes on the hosted runner; reserve time for
    # the device build, packaging and artifact uploads after tests succeed.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test Gemini receipt gateway
        run: node --test backend/tests/receipt-gemini.test.mjs
      - name: Verify source version and required features
        id: release
        run: |
          python3 scripts/check_project.py
          python3 - <<'PYCODE'
          import plistlib, os
          from pathlib import Path
          info=plistlib.loads(Path('YueJi/Info.plist').read_bytes())
          version=info['CFBundleShortVersionString']; build=info['CFBundleVersion']
          assert (version,build)==('1.68.0','98'), 'Wrong source version; expected 1.68.0 build 98'
          source=Path('YueJi/FeatureViews.swift').read_text()
          for name in ['DuplicateReviewView','RefundsView','FriendSummaryView','FuelCalculatorView','UpcomingView','AutomationStatusView','FriendSpendingView','MerchantRulesView','FriendStatementView','RestorePreviewView','NotificationSettingsView','CategoriesView','SpendingComparisonView','LedgerFilterEditor','RefundAllocationFields','CSVExportView','TNGInboxView','TNGNoticeView','TNGSetupView','ReceiptScanView','TNGIncomingView','SavingsGoalsView','ExpenseItemsFields','ExpenseBookkeepingDetails','SavedTransactionItemsSection','PendingBookkeepingCard']:
              assert 'struct '+name in source, 'Missing feature: '+name
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('label='+version+'-build'+build+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Source: '+version+' ('+build+')\nCommit: '+os.environ['GITHUB_SHA']+'\n')
          PYCODE
      - name: Show Xcode version
        run: xcodebuild -version
      # The same simulator Azure picks on this image (iPhone 17, iOS 26), where the UI tests
      # pass. The first iPhone listed depends on the image, so it isn't used.
      - name: Choose an iOS 26 iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/devices.json'))
          phones=[(runtime,d) for runtime,ds in data['devices'].items() if 'iOS-26-' in runtime for d in ds if d.get('isAvailable') and 'iPhone' in d['name']]
          if not phones: raise SystemExit('No available iOS 26 iPhone simulator')
          phones.sort(key=lambda item: (item[1]['name'] != 'iPhone 17', item[0], item[1]['name']))
          runtime, phone = phones[0]
          print('Testing '+phone['name']+' on '+runtime)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+phone['udid']+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Test simulator: '+phone['name']+' ('+runtime+')\n')
          PY
      - name: Build and test
        timeout-minutes: 45
        run: |
          set -o pipefail
          xcodebuild test -project YueJi.xcodeproj -scheme YueJi -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-simulator -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build-test.log
      # Compiler errors and failed tests become annotations on the run (and its summary), so
      # they can be read without downloading the log.
      - name: Report compiler errors and test failures
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          log = Path('build-test.log')
          if not log.exists():
              raise SystemExit(0)
          root = os.environ.get('GITHUB_WORKSPACE', '') + '/'
          pattern = re.compile(r'^(/[^:\n]+):(\d+):(?:(\d+):)? error: (.+)$')
          lines = log.read_text(errors='replace').splitlines()
          seen, found = set(), []
          for line in lines:
              match = pattern.match(line.strip())
              if match and match.group(0) not in seen:
                  seen.add(match.group(0))
                  found.append(match.groups())
          def text(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def prop(value):
              return text(value).replace(':', '%3A').replace(',', '%2C')
          for path, line, col, message in found[:9]:
              rel = path[len(root):] if path.startswith(root) else path
              where = 'file=' + prop(rel) + ',line=' + line + (',col=' + col if col else '')
              print('::error ' + where + '::' + text(message))
          if len(found) > 9:
              rest = [p.split('/')[-1] + ':' + l + ': ' + m for p, l, c, m in found[9:60]]
              print('::error title=More errors::' + text('\n'.join(rest)))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Compiler errors and test failures\n\n')
              for path, line, col, message in found[:60]:
                  summary.write('- `' + path.split('/')[-1] + ':' + line + '` ' + message + '\n')
          # A failing UI case prints the app's accessibility hierarchy. Its windows, bars,
          # sheets and alerts show what was on screen, so keep those as one warning per case.
          landmark = re.compile(r"\b(Window|Sheet|NavigationBar|Alert|Keyboard|TabBar|Toolbar)\b|Grabber|Unsaved draft")
          case, shown = '', 0
          for index, line in enumerate(lines):
              if line.startswith("Test Case '") and line.endswith("' started."):
                  case = line[len("Test Case '"):-len("' started.")]
              if not line.startswith('UI failure: app state') or shown >= 4:
                  continue
              kept = [line]
              for detail in lines[index + 1:index + 2000]:
                  if detail.lstrip().startswith('t =') or detail.startswith('Test Case '):
                      break
                  if landmark.search(detail):
                      kept.append(detail)
              print('::warning title=Screen at failure ' + prop(case) + '::' + text('\n'.join(kept[:120])[:12000]))
              shown += 1
          PYCODE
      - name: Build unsigned device app
        env:
          YUEJI_SUPABASE_URL: ${{ vars.YUEJI_SUPABASE_URL }}
          YUEJI_SUPABASE_PUBLIC_KEY: ${{ vars.YUEJI_SUPABASE_PUBLIC_KEY }}
          YUEJI_REQUIRE_CLOUD: ${{ vars.YUEJI_REQUIRE_CLOUD }}
        run: |
          set -euo pipefail
          python3 scripts/configure_cloud.py
          xcodebuild build -project YueJi.xcodeproj -scheme YueJi -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package for personal signing
        run: |
          python3 - <<'PYCODE'
          import plistlib
          from pathlib import Path
          source=plistlib.loads(Path('YueJi/Info.plist').read_bytes())
          app=plistlib.loads(Path('build-device/Build/Products/Release-iphoneos/YueJi.app/Info.plist').read_bytes())
          for key in ['CFBundleShortVersionString','CFBundleVersion']:
              assert app[key]==source[key], 'Built app version does not match source'
          PYCODE
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiIncoming.wav
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiOutgoing.wav
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiIcon@2x.png
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiIcon@3x.png
          mkdir -p package/Payload
          cp -R build-device/Build/Products/Release-iphoneos/YueJi.app package/Payload/
          cd package
          zip -qr ../YueJi-${{ steps.release.outputs.label }}-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YueJi-${{ steps.release.outputs.label }}-run${{ github.run_number }}
          path: YueJi-${{ steps.release.outputs.label }}-unsigned.ipa
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YueJi-diagnostics-run${{ github.run_number }}
          path: |
            build-test.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
