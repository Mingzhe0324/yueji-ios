name: Build YueJi iPhone App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify source version and required features
        id: release
        run: |
          python3 scripts/check_project.py
          python3 - <<'PYCODE'
          import plistlib, os
          from pathlib import Path
          info=plistlib.loads(Path('YueJi/Info.plist').read_bytes())
          version=info['CFBundleShortVersionString']; build=info['CFBundleVersion']
          assert (version,build)==('1.67.0','97'), 'Wrong source version; expected 1.67.0 build 97'
          source=Path('YueJi/FeatureViews.swift').read_text()
          for name in ['DuplicateReviewView','RefundsView','FriendSummaryView','FuelCalculatorView','UpcomingView','AutomationStatusView','FriendSpendingView','MerchantRulesView','FriendStatementView','RestorePreviewView','NotificationSettingsView','CategoriesView','SpendingComparisonView','LedgerFilterEditor','RefundAllocationFields','CSVExportView','TNGInboxView','TNGNoticeView','TNGSetupView','ReceiptScanView','TNGIncomingView','SavingsGoalsView','ExpenseItemsFields','ExpenseBookkeepingDetails','SavedTransactionItemsSection','PendingBookkeepingCard']:
              assert 'struct '+name in source, 'Missing feature: '+name
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('label='+version+'-build'+build+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Source: '+version+' ('+build+')\nCommit: '+os.environ['GITHUB_SHA']+'\n')
          PYCODE
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Choose installed iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/devices.json'))
          phones=[d for runtime,ds in data['devices'].items() if 'iOS' in runtime for d in ds if d.get('isAvailable') and 'iPhone' in d['name']]
          if not phones: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+phones[0]['udid']+'\n')
          PY
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project YueJi.xcodeproj -scheme YueJi -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-simulator -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build-test.log
      - name: Build unsigned device app
        run: |
          xcodebuild build -project YueJi.xcodeproj -scheme YueJi -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package for personal signing
        run: |
          python3 - <<'PYCODE'
          import plistlib
          from pathlib import Path
          source=plistlib.loads(Path('YueJi/Info.plist').read_bytes())
          app=plistlib.loads(Path('build-device/Build/Products/Release-iphoneos/YueJi.app/Info.plist').read_bytes())
          for key in ['CFBundleShortVersionString','CFBundleVersion']:
              assert app[key]==source[key], 'Built app version does not match source'
          PYCODE
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiIncoming.wav
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiOutgoing.wav
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiIcon@2x.png
          test -f build-device/Build/Products/Release-iphoneos/YueJi.app/YueJiIcon@3x.png
          mkdir -p package/Payload
          cp -R build-device/Build/Products/Release-iphoneos/YueJi.app package/Payload/
          cd package
          zip -qr ../YueJi-${{ steps.release.outputs.label }}-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YueJi-${{ steps.release.outputs.label }}-run${{ github.run_number }}
          path: YueJi-${{ steps.release.outputs.label }}-unsigned.ipa
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YueJi-diagnostics-run${{ github.run_number }}
          path: |
            build-test.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
